<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161026" />
  <title>Brithi’s Birthday Bonanza</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ffc14d'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='Georgia' fill='%2324160f'%3E$%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,700;1,9..144,560&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Shopping spree</p>
        <p class="brand-title">Brithi’s Bonanza</p>
      </div>
      <div class="top-actions">
        <p class="purse" aria-live="polite">
          <span class="purse-label">Spree</span>
          <strong id="purse-total">$0</strong>
        </p>
        <button id="mute" class="icon-btn" type="button" aria-pressed="false">Sound on</button>
      </div>
    </header>
    <ol class="track" id="track" aria-label="Rounds"></ol>
    <main id="stage"></main>
  </div>
  <noscript>
    <p class="noscript">This birthday needs JavaScript turned on.</p>
  </noscript>
  <script src="js/game.js"></script>
</body>
</html>
